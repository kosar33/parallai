const B1=[['t',165,10,'мс на токен (меньше — лучше)'],...[1312,794,494,588].flatMap((v,i)=>{const h=v*80/1312,x=25+i*58;return[['r',x,100-h,40,h,'','n'],['t',x+20,96-h,v],['t',x+20,114,['1 узел','2 узла','4 узла','8 узлов'][i]]]})];
const B2=[['t',130,10,'токенов/с: llama.cpp — оранж., exo — зелён.'],...[0,1,2].flatMap(i=>[[20.4,17.2,15.2],[19.5,26.2,31.9]].flatMap((a,j)=>{const v=a[i],h=v*80/35,x=20+i*80+j*34;return[['r',x,100-h,30,h,'',j?'g':'n'],['t',x+15,96-h,v]]}).concat([['t',52+i*80,114,['1 узел','2 узла','4 узла'][i]]]))];
const sw=[].concat(...[0,1,2].map(s=>[0,1,2].map(n=>['r',20+s*90,10+n*30,50,22,'узел']))).concat([[70,21,110,81],[70,51,110,21],[70,81,110,51],[160,21,200,51],[160,51,200,81],[160,81,200,21]].map(a=>['a',...a]),[['t',130,112,'случайные конвейеры, перебалансировка при сбое']]);
const tk=[['t',8,14,'Классика: обмен каждый шаг','s l'],...Array.from({length:24},(_,i)=>['r',8+i*10,20,4,14,'','n']),['t',8,58,'DiLoCo: 500 локальных шагов → 1 обмен','s l'],['r',8,64,236,14,'','g'],['r',246,60,6,22,'','n'],['t',8,104,'AdamW внутри, Nesterov снаружи; ~500× реже','s l']];
const S=[
{t:'Как распределяют вычисления больших моделей',s:'Любая схема отвечает на один вопрос: что разрезать и что за это гонять по сети. Чем чаще обмен, тем быстрее нужна связь.',
 x:V([...['Wi-Fi','1–10 GbE','TB (TCP)','TB5 RDMA','InfiniBand','NVLink'].map((k,i)=>['r',5+i*120,8,110,28,k]),...[['DP-инференс','Best-of-N, MoA'],['PP, DiLoCo','Petals, async RL'],['PP, CP','TP: 2–4 узла'],['TP (Mac, exo)','CP'],['EP, FSDP','Prefill/Decode'],['TP, EP','NVL72 (стойка)']].flatMap((m,i)=>[['t',60+i*120,56,m[0]],['t',60+i*120,72,m[1]]]),['a',5,100,715,100,'больше обмена → нужна быстрее сеть']],'0 0 720 112')},
{t:'1. Разрезание одной модели: память суммируется',s:'Модель не влезает в один узел — делим её. Плата: трафик между узлами.',p:[
['Конвейерный параллелизм (Pipeline Parallelism, PP): по слоям','Модель режется по слоям, как конвейер: первый узел считает слои 1–20 и передаёт результат второму, тот третьему. Между узлами идёт мало данных: около 16 КБ на токен (при размере скрытого слоя 8192), для запроса в 10 тысяч токенов около 160 МБ. Поэтому хватает обычного Ethernet или Thunderbolt, а на разнородных домашних устройствах работает даже обычный Wi-Fi (prima.cpp), только медленно. Минус: в каждый момент работает один узел, поэтому один ответ быстрее не становится.',[['r',6,40,60,34,'Слои 1–20'],['r',100,40,60,34,'21–40'],['r',194,40,60,34,'41–60'],['a',66,57,100,57,'16 КБ'],['a',160,57,194,57,'16 КБ'],['t',130,100,'в каждый момент считает один узел']]],
['Тензорный параллелизм (Tensor Parallelism, TP): внутри слоя','Каждый слой делится между устройствами: каждое считает свою часть матрицы, а потом результаты складываются (операция All-Reduce). Складывать нужно на каждом слое, то есть около 64 раз на токен при 32 слоях. Поэтому важна не скорость сети, а задержка: при 0,5 мс на один обмен выходит не больше около 30 токенов в секунду, как бы ни были мощны чипы. Работает на NVLink (быстрая связь между видеокартами NVIDIA) и на компьютерах Mac с Thunderbolt 5 и RDMA (прямой доступ к памяти соседнего компьютера; программа exo). По Wi-Fi не годится: при 3–7 мс на обмен одна только сеть отнимает 0,2–0,45 с на токен (мой расчёт).',[['r',10,10,90,34,'½ матрицы'],['r',10,74,90,34,'½ матрицы'],['r',150,42,60,34,'Σ','n'],['a',100,27,150,52],['a',100,91,150,66],['t',180,100,'на каждом слое']]],
['Контекстный параллелизм (Context Parallelism, CP): по длине','Очень длинный запрос делится на куски, и каждый узел держит свой кусок. Чтобы каждый кусок «увидел» все остальные, узлы по кругу передают друг другу данные внимания (ключи и значения). Пример Meta (2024): запрос в 1 миллион токенов для Llama 3 405B (405 миллиардов параметров) обработан за 77 секунд на 128 видеокартах H100. Связь через RDMA и через обычный протокол TCP дала близкую скорость: метод менее требователен к сети, чем тензорный.',[...[8,72,136,200].map((x,i)=>['r',x,30,50,30,'Блок '+(i+1)]),...[8,72,136].map(x=>['a',x+50,45,x+64,45]),['a',225,60,225,90],['a',225,90,33,90],['a',33,90,33,60],['t',130,108,'кольцо']]],
['Экспертный параллелизм (Expert Parallelism, EP): смесь экспертов','В модели со смесью экспертов (Mixture of Experts, MoE) много небольших «экспертов», и каждый токен обращается лишь к нескольким. Поэтому экспертов раскладывают по узлам, а «маршрутизатор» рассылает токены нужным экспертам (обмен «каждый каждому», All-to-All). Пример: DeepSeek-V4-Pro — 1,6 триллиона параметров, из них на токен работают 49 миллиардов; V4-Flash — 284 и 13 миллиардов. Слабое место: популярные («горячие») эксперты перегружаются. DeepSeek прячет обмен за вычислениями: эксперты делятся на «волны», и пока считается одна волна, токены для следующей уже в пути. Итог: быстрее в 1,50–1,73 раза при обычной выдаче ответов и до 1,96 раза при генерации примеров для обучения с подкреплением; реализация MegaMoE открыта. Условие: на каждый 1 ГБ/с связи приходится не больше около 6,1 триллиона операций в секунду вычислений.',[['r',6,45,44,30,'Выбор','n'],['r',110,8,60,26,'Эксп. 1'],['r',110,47,60,26,'Эксп. 2','g'],['r',110,86,60,26,'Эксп. 3'],['a',50,55,110,21],['a',50,60,110,60],['t',215,62,'2 из N']]],
['Параллелизм по последовательности (Sequence Parallelism, SP)','При тензорном параллелизме часть операций слоя (нормализация LayerNorm, случайное отключение нейронов dropout) выполняется на всех устройствах одинаково, то есть дублируется. Этот метод делит такую работу по токенам, чтобы не дублировать; действует внутри группы тензорного параллелизма. Не путать с контекстным: тот делит длину контекста внутри самого внимания.',[['r',8,14,160,30,'Умножение матриц'],['r',8,54,160,30,'Нормализация по токенам','g'],['t',214,50,'в одной группе','s']]],
['Полностью шардированный параллелизм по данным (Fully Sharded Data Parallel, FSDP) и ZeRO-3','При обучении память занимают веса, градиенты (поправки к весам) и состояние оптимизатора. Здесь всё это разделено по устройствам: у каждого своя доля. Перед расчётом слоя нужный кусок собирают со всех (all-gather), после шага градиенты суммируют и раздают обратно (reduce-scatter). ZeRO-3 (Zero Redundancy Optimizer, «оптимизатор без избыточности») делает то же самое. Трафик примерно в 1,5 раза больше, чем при обычном параллелизме по данным, зато память на устройство падает почти пропорционально числу узлов. Нужна быстрая сеть дата-центров (InfiniBand). У DeepSeek-V4 для оптимизатора Muon сделан гибрид: у плотных параметров размер группы ограничен, у экспертов нет.',[...[10,95,180].map(x=>['r',x,10,70,30,'⅓ весов']),...[45,130,215].map(x=>['a',x,40,x,80]),['r',10,80,240,28,'сбор слоя → счёт → разнесение градиентов','n']]]]},
{t:'2. Масштабирование нагрузки и гибриды',s:'Память не суммируется: каждая копия целиком. Или комбинируем методы по уровням железа.',p:[
['Параллелизм по данным (Data Parallelism, DP) при выдаче ответов','Каждый узел держит полную копию модели, а балансировщик нагрузки раздаёт запросы по копиям. По сети ходят только тексты запроса и ответа, поэтому хватает домашней сети (вывод из объёма данных, отдельного замера нет). Число обслуженных запросов растёт почти пропорционально числу копий, но один ответ быстрее не становится, а память не суммируется.',[['r',6,44,52,32,'Раздача','n'],['r',120,6,80,28,'Копия 1'],['r',120,46,80,28,'Копия 2'],['r',120,86,80,28,'Копия 3'],['a',58,60,120,20],['a',58,60,120,60],['a',58,60,120,100],['t',232,64,'Wi-Fi']]],
['Параллелизм по данным (DP) при обучении','Каждый воркер (рабочий узел) считает градиенты на своей части данных, потом градиенты усредняются. Трафик равен размеру модели: для модели в 8 миллиардов параметров в 16-битных числах это около 16 ГБ за шаг. Если дообучать только небольшие добавки LoRA (низкоранговая адаптация), ходят только они, десятки МБ, и хватает обычной сети.',[['r',8,8,70,26,'Воркер 1'],['r',8,47,70,26,'Воркер 2'],['r',8,86,70,26,'Воркер 3'],['r',150,42,80,34,'Σ градиентов','n'],['a',78,21,150,52],['a',78,60,150,60],['a',78,99,150,68],['t',190,100,'трафик = размеру модели']]],
['Лучший из N, дерево рассуждений, голосование','Несколько независимых попыток: «лучший из N» (Best-of-N), ветвление рассуждений («дерево рассуждений», Tree of Thoughts) или голосование ответов (self-consistency). Узлам почти не нужно общаться, поэтому такая нагрузка идеально раскладывается по машинам. Но нужен верификатор (модуль, который проверяет ответы) или правило голосования, иначе лишние ответы ничего не дают.',[['r',6,44,50,32,'Запрос'],...[8,48,88].flatMap(y=>[['r',95,y,50,26,'Ответ'],['a',56,60,95,y+13],['a',145,y+13,182,60]]),['r',182,44,70,32,'Верификатор','g']]],
['Гибриды из трёх и четырёх видов параллелизма','Методы вкладывают друг в друга по уровням железа. Самые частые обмены (тензорный и экспертный параллелизм) идут внутри одного узла по NVLink, конвейерный и контекстный — между узлами, FSDP или параллелизм по данным — между стойками по InfiniBand. Так обучалась Llama 3: тензорный, конвейерный и контекстный параллелизм плюс FSDP.',[['r',4,4,252,112],['t',130,18,'Данные: между стойками (InfiniBand)'],['r',14,26,232,84],['t',130,40,'Конвейер и контекст: между узлами'],['r',24,48,212,50,'Тензоры и эксперты внутри узла','g']]]]},
{t:'3. Серверные и рантайм-приёмы',s:'Модель та же. Меняется, как организованы фазы, память и кэши.',p:[
['Раздельные разбор запроса (prefill) и выдача токенов (decode)','Обработка запроса (prefill) упирается в вычисления, а выдача слов по одному (decode) — в скорость памяти. Поэтому их выполняют на разных группах машин, а накопленный кэш внимания (KV-кэш: «ключи и значения» уже прочитанных слов) пересылают между ними по RDMA (прямой доступ к памяти другой машины). Так делают в промышленных системах: DistServe, Splitwise, Mooncake.',[['r',6,36,90,40,'Разбор запроса'],['r',164,36,90,40,'Выдача токенов','g'],['a',96,56,164,56,'кэш'],['t',130,100,'DistServe · Splitwise · Mooncake']]],
['Разделение внимания и полносвязной сети слоя (Attention–FFN Disaggregation, AFD)','В слое со смесью экспертов (MoE) две части работают по-разному: внимание и полносвязная сеть (FFN, feed-forward network). Внимание копируют на несколько видеокарт, а FFN раскладывают по экспертам на отдельных видеокартах. Система MegaScale-Infer получила до 1,90× пропускной способности на видеокарту.',[['r',6,14,70,30,'Внимание'],['r',6,62,70,30,'Внимание'],['r',150,8,70,24,'Эксперт 1','g'],['r',150,40,70,24,'Эксперт 2','g'],['r',150,72,70,24,'Эксперт 3','g'],['a',76,29,150,20],['a',76,77,150,84]]],
['Спекулятивное декодирование','Маленькая модель (или «голова» MTP, предсказывающая сразу несколько токенов, как в DeepSeek-V4) быстро предлагает черновик из 5–8 токенов, а большая проверяет их за один проход. Ответ получается тот же, что и без черновика (методы EAGLE, Medusa, lookahead, prompt-lookup). Если черновик считается на другом компьютере, каждый раунд добавляет сетевую задержку (RTT, время «туда и обратно»), поэтому метод выгоден, только когда проверка большой моделью заметно дольше RTT.',[['r',6,40,70,36,'Черновик','n'],['r',150,40,100,36,'Проверка большой'],['a',76,58,150,58,'5–8 токенов'],['t',130,100,'выход тот же; вынос черновика = +задержка']]],
['PowerInfer','У многих моделей часть нейронов срабатывает почти всегда («горячие»), а большинство срабатывает редко («холодные»). Горячие держат на видеокарте, холодные считают на процессоре. В статье ускорение до 11,69× к llama.cpp на видеокарте RTX 4090, но для моделей 2023 года с активацией ReLU (она обнуляет отрицательные значения, и потому многие нейроны «молчат»). На современных моделях эффект зависит от того, сколько нейронов молчит.',[['r',10,14,110,34,'Видеокарта: частые','g'],['r',10,62,200,34,'Процессор: редкие (их большинство)','n'],['t',130,112,'до 11,69× к llama.cpp']]],
['Выгрузка весов (offloading) и деление по памяти','Если модель не влезает в видеопамять (VRAM), часть весов держат в обычной оперативной памяти или на быстром диске (SSD с интерфейсом NVMe) и подгружают по мере надобности. На нескольких машинах веса делят пропорционально памяти каждой (программа exo, режим llama.cpp --tensor-split). Отдельно можно сжать кэш внимания (квантование кэша): он занимает меньше места, и помещается более длинный контекст.',[['r',10,8,100,26,'Видеопамять','g'],['r',10,42,160,26,'Оперативная память'],['r',10,76,230,26,'Быстрый твердотельный диск'],['t',200,22,'быстро · мало'],['t',130,116,'деление по памяти · выгрузка · сжатие кэша']]],
['Память и планирование','Набор приёмов, чтобы память и видеокарты не простаивали. PagedAttention хранит кэш внимания страницами, без пустых дыр. Кэширование префикса (prefix caching) считает общее начало запросов один раз. Непрерывная пакетная обработка (continuous batching) и разбор запроса по частям (chunked prefill) выравнивают загрузку. Два приёма относятся к обучению: пересчёт промежуточных значений (activation checkpointing) экономит память ценой около 30 % лишних вычислений, а DualPipe совмещает вычисления и обмен данными. DeepSeek-V4 приспособила DualPipe с чередованием прямого и обратного проходов (1F1B) под возросший трафик между стадиями. Для общих префиксов V4 хранит сжатый кэш внимания на диске (SSD) и не пересчитывает префикс заново.',[['r',8,14,36,24,'A1','g'],['r',48,14,36,24,'A2','g'],['r',88,14,36,24,'B1','n'],['r',128,14,36,24,'A3','g'],['r',168,14,36,24,'B2','n'],['r',208,14,36,24,''],['t',130,60,'кэш внимания страницами, без фрагментации'],['t',130,80,'общий префикс — один раз']]]]},
{t:'4. Смена модели',s:'Меняем архитектуру или веса, чтобы сеть и память нужны были меньше. Закладывается при обучении или теряет точность.',p:[
['Сжатие кэша внимания: MLA, CSA, HCA и родственные методы','Идея: хранить меньше ключей и значений, то есть кэша внимания. Многоголовое латентное внимание (Multi-head Latent Attention, MLA) в DeepSeek-V2 сжало кэш на 93,3 % по сравнению с DeepSeek 67B и дало 5,76× пропускной способности генерации. Родственные приёмы: группированное и мультизапросное внимание (Grouped-Query и Multi-Query Attention, GQA и MQA) и разреженное внимание. В DeepSeek-V4 внимание — гибрид сжатого разреженного (Compressed Sparse Attention, CSA) и сильно сжатого (Heavily Compressed Attention, HCA). По техотчёту, при контексте в миллион токенов V4-Pro требует 27 % операций на токен и 10 % кэша от V3.2, а V4-Flash — 10 % операций и 7 % кэша. Закладывается при обучении.',[['t',10,14,'Размер кэша внимания к прошлому поколению','s l'],['r',10,20,220,18,'база: 100 %'],['r',10,44,15,18,'','g'],['t',32,57,'V2 к 67B: 6,7 %','s l'],['r',10,70,22,18,'','g'],['t',38,83,'V4-Pro к V3.2, миллион токенов: 10 %','s l'],['r',10,92,15,18,'','g'],['t',32,105,'V4-Flash к V3.2: 7 %','s l']]],
['Модели пространства состояний (State Space Models, SSM) и гибриды','Обычный трансформер хранит кэш, который растёт вместе с контекстом. Модели пространства состояний (State Space Models, SSM) вместо этого хранят состояние фиксированного размера (Mamba, RWKV). Бывают и гибриды: у MiniMax-01 семь слоёв с линейным вниманием чередуются с одним слоем полного внимания. Цена: чистые SSM хуже достают точные факты из контекста, поэтому полное внимание оставляют хотя бы в части слоёв.',[['t',10,14,'Трансформер: кэш растёт с контекстом','s l'],['r',10,20,40,14,'','n'],['r',10,36,100,14,'','n'],['r',10,52,200,14,'','n'],['t',10,84,'Пространство состояний: размер фиксирован','s l'],['r',10,90,40,14,'','g']]],
['Квантование, прунинг, дистилляция','Веса хранят в меньшей точности: модель на 70 миллиардов параметров занимает около 140 ГБ в 16-битных числах и около 40 ГБ в 4-битных. Прунинг выбрасывает малозначимые веса, дистилляция обучает маленькую модель повторять большую. Это не равноценная замена: за экономию платят качеством.',[['r',10,14,220,30,'70 миллиардов параметров ≈ 140 ГБ'],['r',10,58,63,30,'≈ 40 ГБ','g'],['t',82,78,'4 бита · прунинг · дистилляция','s l']]],
['BitNet b1.58','Веса принимают всего три значения: −1, 0, +1 (это 1,58 бита), поэтому умножения заменяются сложениями. Заявка «модель на 100 миллиардов параметров на процессоре» — демонстрационная конфигурация. Реально обученные модели — до около 10 миллиардов параметров (официальная модель на 2 миллиарда, обученная на 4 триллионах токенов).',[['r',10,14,50,40,'−1'],['r',70,14,50,40,'0'],['r',130,14,50,40,'+1','g'],['t',130,78,'веса по 1,58 бита'],['t',130,96,'реально до ~10B']]],
['Диффузионные языковые модели','Текст не пишется слева направо, а уточняется за несколько итераций сразу целиком (LLaDA, Mercury). Каждая итерация — проход по всей модели, поэтому выигрыш для кластера зависит от реализации.',[['r',6,36,70,36,'шум'],['r',96,36,70,36,'черновик'],['r',186,36,68,36,'текст','g'],['a',76,54,96,54],['a',166,54,186,54],['t',130,100,'итерации по всей модели']]],
['Каскады, ранний выход, смесь глубин, поиск, смесь агентов','Группа способов не гонять большую модель без нужды. Каскады: лёгкая модель отвечает сама, трудные запросы уходят большой. Ранний выход (early-exit) и смесь глубин (Mixture-of-Depths) пропускают часть слоёв. Генерация с дополнением поиском (Retrieval-Augmented Generation, RAG) выносит знания в поиск. Смесь агентов (Mixture of Agents, MoA) — несколько моделей и агрегатор; это не то же самое, что смесь экспертов.',[['r',6,40,56,36,'Малая','g'],['r',100,40,56,36,'Большая'],['a',62,58,100,58,'сложно'],['r',190,40,60,36,'Ответ','n'],['a',156,58,190,58],['t',130,100,'Ранний выход · смесь глубин · поиск']]]]},
{t:'5. Смена схемы обучения: синхронизироваться реже',s:'Идея: не гонять градиенты каждый шаг. Внутри «острова» быстрая сеть, между островами редкий обмен.',p:[
['DiLoCo','DiLoCo (Distributed Low-Communication, «распределённое обучение с малым обменом»): каждый воркер сам делает 500 шагов обучения (оптимизатор AdamW), затем отправляет итоговую поправку к весам (псевдоградиент), а внешний оптимизатор (метод Нестерова) применяет её к общим весам. Обменов примерно в 500 раз меньше при 8 воркерах; вариант Streaming DiLoCo снижает пиковую нагрузку на канал ещё примерно в 100 раз. INTELLECT-1 (10 миллиардов параметров) обучена на трёх континентах. Важно: воркер здесь — быстро связанная группа машин («остров»), а не один домашний компьютер.',tk],
['SWARM','Вместо фиксированного конвейера запросы идут по случайным временным маршрутам между узлами одной стадии, а при сбоях узлы перераспределяются между стадиями. Показано на модели с 1 миллиардом общих параметров (около 13 миллиардов до разделения весов) на прерываемых видеокартах T4 при сети менее 200 Мбит/с. Работает потому, что с ростом модели доля сетевых затрат в конвейерном параллелизме падает.',sw],
['Асинхронное обучение с подкреплением: INTELLECT-2, AReaL','INTELLECT-2: модель на 32 миллиарда параметров, полностью асинхронное обучение с подкреплением (Reinforcement Learning, RL) на рое добровольцев (библиотека PRIME-RL). Примеры ответов (роллауты) передавать дёшево, и их считают на чужом железе; узкое место — раздача свежих весов (протокол SHARDCAST, в среднем около 14 минут по пересказу статьи). AReaL (NeurIPS 2025) полностью разделяет генерацию и обучение и следит, чтобы данные не слишком устарели, с помощью варианта PPO (Proximal Policy Optimization, проксимальная оптимизация политики): до 2,77× к синхронной системе на тех же видеокартах. Это система для кластера, а не для роя добровольцев.',[['r',6,10,70,28,'Роллауты'],['r',6,46,70,28,'Роллауты'],['r',6,82,70,28,'Роллауты'],['r',130,42,70,36,'Тренер','g'],['a',76,24,130,52],['a',76,60,130,60],['a',76,96,130,68],['t',130,116,'асинхронно, без ожидания']]],
['Petals (2022–2023)','Модель делится на блоки, каждый участник сети (пир) держит свой блок, а запрос идёт по цепочке пиров через интернет (по сути конвейерный параллелизм). По описанию проекта (README): до 6 токенов в секунду на Llama 2 70B и до 4 на Falcon 180B, поддерживаются модели до Llama 3.1 405B. В статье 2022 года участники считаются доверяющими друг другу: данные клиента видят все узлы цепочки. Работает ли публичная сеть сегодня, не проверено.',[...[6,70,134,198].map((x,i)=>['r',x,40,50,36,'Пир '+(i+1)]),...[6,70,134].map(x=>['a',x+50,58,x+70-6,58]),['t',130,100,'цепочка пиров = конвейер через интернет']]],
['TOPLOC: проверка чужих вычислений','Способ проверить, что чужой узел честно посчитал ответ. Берётся «отпечаток» (хеш) промежуточных результатов модели: 258 байт на 32 токена, а проверка до 100× быстрее самой выдачи ответов. Метод обнаруживает подмену модели, запроса или точности, но не защищает всю цепочку между равноправными узлами (peer-to-peer, P2P). Прежняя оценка накладных расходов «10–20 %» не подтверждена.',[['r',6,36,70,36,'Воркер'],['r',100,36,70,36,'Хеш','n'],['r',190,36,62,36,'Проверка','g'],['a',76,54,100,54],['a',170,54,190,54],['t',130,96,'258 байт / 32 токена']]],
['MeZO: обучение без обратного прохода','MeZO (Memory-efficient Zeroth-order optimizer, экономный по памяти оптимизатор нулевого порядка) оценивает, куда двигать веса, по двум прямым проходам: веса слегка сдвигают случайным шумом в одну и в другую сторону и сравнивают результат. Обратный проход не нужен, поэтому памяти надо столько же, сколько при выдаче ответов. На одной видеокарте A100 на 80 ГБ дообучается модель на 30 миллиардов параметров против 2,7 миллиарда при обычном обучении: до 12× экономии памяти и до 2× по часам работы видеокарты (в реализации авторов). Работает и с адаптерами LoRA, и с целями, которые нельзя продифференцировать (точность, мера F1).',[['r',8,40,56,36,'Веса'],['r',100,12,76,30,'проход θ+εz','n'],['r',100,74,76,30,'проход θ−εz','n'],['r',204,40,48,36,'Шаг','g'],['a',64,52,100,28],['a',64,64,100,88],['a',176,27,204,50],['a',176,89,204,66],['t',130,116,'память как у инференса']]],
['Branch-Train-Merge: эксперты без синхронизации','Branch-Train-Merge («ответвить, обучить, слить»): несколько экспертных языковых моделей обучаются независимо друг от друга на разных областях (научные тексты, юридические и так далее), параметры между ними не синхронизируются. Потом экспертов можно добавлять и убирать, использовать вместе (ансамбль) или усреднить в одну модель. Условие: эксперты должны специализироваться по областям, случайное разбиение данных не работает. Статья 2022 года.',[['r',6,42,56,32,'База'],['r',100,8,76,26,'Эксперт A','g'],['r',100,47,76,26,'Эксперт B','g'],['r',100,86,76,26,'Эксперт C','g'],['a',62,52,100,21],['a',62,58,100,60],['a',62,64,100,99],['r',204,42,50,32,'Merge','n'],['a',176,21,204,50],['a',176,60,204,58],['a',176,99,204,66]]],
['PipeDream: чередование прямого и обратного проходов','PipeDream (2019) подаёт в конвейер много порций данных (минибатчей) сразу: каждая стадия по очереди делает один прямой проход и один обратный (схема 1F1B, «one forward, one backward»), поэтому простоев почти нет. Чтобы градиенты остались корректными, под каждый минибатч хранится своя версия весов (weight stashing). Заявлено до 5,3× к обычному параллелизму внутри батча на задачах с глубокими нейронными сетями (Deep Neural Networks, DNN); на больших языковых моделях цифры не проверялись. Идея живёт в современных схемах конвейерного параллелизма, в том числе у DeepSeek (DualPipe).',[['t',10,16,'Стадия: 1 вперёд, 1 назад','s l'],['r',8,24,34,24,'F4'],['r',46,24,34,24,'B1','n'],['r',84,24,34,24,'F5'],['r',122,24,34,24,'B2','n'],['r',160,24,34,24,'F6'],['r',198,24,34,24,'B3','n'],['t',10,72,'версия весов на каждый минибатч','s l'],['r',8,80,70,22,'w v1','g'],['r',84,80,70,22,'w v2','g'],['r',160,80,70,22,'w v3','g']]],
['PowerSGD и 1-bit Adam: сжатие градиентов','Два способа сжать градиенты при параллелизме по данным, чтобы по сети шло меньше. PowerSGD (2019) заменяет градиент слоя приближением из двух небольших матриц и суммирует именно их; качество на уровне стохастического градиентного спуска (Stochastic Gradient Descent, SGD) на свёрточных сетях и сетях LSTM (Long Short-Term Memory, долгая краткосрочная память). 1-bit Adam (2021): после прогрева оценка дисперсии в оптимизаторе Adam фиксируется, дальше каждое число градиента передаётся одним битом, а ошибки накапливаются; до 5× меньше трафика, до 3,3× выше пропускная способность на модели BERT-Large (до 256 видеокарт). Проверено на задачах без современных больших языковых моделей.',[['t',10,14,'PowerSGD: градиент ≈ P × Q','s l'],['r',8,22,50,50,'G'],['a',58,47,86,47],['r',90,22,16,50,'P','g'],['t',114,52,'×'],['r',124,38,60,16,'Q','g'],['t',10,92,'1-bit Adam: 1 бит на число + накопление ошибки','s l'],['r',8,98,236,14,'','n']]],
['Остальные названия','Эти названия приведены для полноты картины: Gossip SGD, Hogwild, model soups, TIES, sparse upcycling, федеративное и раздельное (split) обучение, Forward-Forward. По источникам не проверялись, поэтому без пояснений и цифр.',[['t',10,24,'Gossip SGD · Hogwild','s l'],['t',10,44,'model soups · TIES · sparse upcycling','s l'],['t',10,64,'федеративное и раздельное обучение','s l'],['t',10,84,'Forward-Forward, Hebbian — только в науке','s l']]]
]},
{t:'6. Замеры',s:'Реальные цифры из описаний проектов (README) и обзоров.',p:[
['distributed-llama: тензорный параллелизм по Ethernet 1 Гбит/с','Тензорный параллелизм по обычному гигабитному Ethernet на компьютерах Raspberry Pi 4B, модель Llama 2 7B (7 миллиардов параметров). Время на токен: 1312 → 794 → 494 мс на 1, 2 и 4 узлах, а на 8 узлах снова хуже — 588 мс, из них около 290 мс уходит на сеть. Число узлов может быть только степенью двойки; это демонстрационный образец (proof of concept). Вывод: тензорный параллелизм по Ethernet работает на 2–4 слабых узлах, дальше упирается в сеть.',V(B1)],
['exo vs llama.cpp, Mac Studio','Замеры Джеффа Гирлинга (2025) на Mac Studio M3 Ultra, модель Qwen3 235B (235 миллиардов параметров). В llama.cpp с ростом числа узлов скорость падает (20,4 → 17,2 → 15,2 токена в секунду), а в exo с RDMA по Thunderbolt 5 растёт (19,5 → 26,2 → 31,9). Для DeepSeek V3.1 671B: 21,1 → 27,8 → 32,5. Задержка между узлами упала с около 300 до менее 50 мкс (macOS 26.2). Модели прошлого поколения, но вывод от модели не зависит: для тензорного параллелизма нужен RDMA.',V(B2)]]},
{t:'7. Железо и сеть: что какую выдерживает',s:'да — практично; с оговорками; нет — не подходит. Оценка по данным каталога и замерам prima.cpp, Petals, SWARM, INTELLECT-1.',
 x:'<div style="overflow-x:auto"><table><tr><th></th>'+['Wi-Fi дома','Домашний интернет','Ethernet 1–10 Гбит/с','Thunderbolt (TCP)','Thunderbolt 5 с RDMA','InfiniBand','NVLink'].map(k=>'<th>'+k+'</th>').join('')+'</tr>'+[['Выдача ответов копиями, смесь агентов, лучший из N','2222222'],['DiLoCo, Petals, асинхронное обучение с подкреплением','1222222'],['Конвейерный (PP)','1122222'],['Контекстный (CP)','0011222'],['Тензорный (TP)','0010222'],['Экспертный (EP), FSDP','0000122'],['Раздельные разбор запроса и выдача токенов','0000122']].map(r=>'<tr><td>'+r[0]+'</td>'+[...r[1]].map(v=>'<td class="h'+v+'">'+['нет','с оговорками','да'][v]+'</td>').join('')+'</tr>').join('')+'</table></div><p class="sub" style="margin-top:12px">Wi-Fi дома: в тестах prima.cpp (arXiv 2504.08791) четыре устройства соединены через обычный роутер: канал 320–610 Мбит/с, задержка 3–7 мс. Конвейерный параллелизм (PP) при этом работает, но медленно. Для тензорного параллелизма (TP) по Wi-Fi замера нет, это мой расчёт: 64 синхронизации по 3–7 мс дают 0,2–0,45 с на токен только на сеть. Для копий модели по Wi-Fi замера тоже нет: вывод из того, что передаются только тексты.</p><p class="sub">Термины из таблицы. TCP/IP — обычные сетевые протоколы (Transmission Control Protocol и Internet Protocol); по ним работают Wi-Fi, Ethernet и Thunderbolt без RDMA. Для конвейерного параллелизма и копий модели их хватает, для тензорного нет. Thunderbolt: задержка по TCP около 300 мкс, RDMA на Thunderbolt 5 — менее 50 мкс (macOS 26.2). RDMA — прямой доступ к памяти другой машины; RoCE — RDMA поверх Ethernet; InfiniBand — быстрая сеть дата-центров. SHARP (Scalable Hierarchical Aggregation and Reduction Protocol) складывает данные прямо в сетевых коммутаторах. CXL (шина Compute Express Link) приближает внешнюю память к оперативной, но не заменяет высокоскоростную память видеокарт HBM. OCS (Optical Circuit Switch) — оптические коммутаторы, перестройка на уровне заданий. NVL72 — стойка NVIDIA на 72 видеокарты, тензорный параллелизм на уровне стойки. Не сверялось по источникам: специализированные чипы Cerebras и Groq, PIM (Processing-In-Memory, вычисления в памяти) и оптика, встроенная в корпус чипа.</p>'},

 x:'<div class="g"><div class="c"><h3>Сверено по источникам</h3><ul><li>Тензорный параллелизм на Mac с RDMA по Thunderbolt 5 (замеры программы exo)</li><li>Контекстный параллелизм у Meta, разделение внимания и FFN (MegaScale-Infer), PowerInfer, MLA</li><li>DiLoCo, SWARM, INTELLECT-2, AReaL, TOPLOC, MeZO, Branch-Train-Merge</li><li>PipeDream, PowerSGD, 1-bit Adam (по аннотациям статей)</li><li>Petals: цифры из описания проекта (README); работу публичной сети сегодня не проверял</li><li>distributed-llama</li><li>prima.cpp: параметры Wi-Fi-сети из статьи; скорости 11 и 1,5 токена в секунду из описания проекта</li><li>Параметры DeepSeek-V4 (Pro 1,6 триллиона, Flash 284 миллиарда); цифры про кэш внимания, число операций и схему экспертного параллелизма V4 взяты из самого техотчёта (arXiv 2606.19348)</li></ul></div><div class="c"><h3>Исправлено относительно первой версии</h3><ul><li>Параллелизм по последовательности и контекстный параллелизм — разные методы</li><li>DualPipe — для обучения, не для выдачи ответов</li><li>DiLoCo: оптимизатор AdamW внутри, метод Нестерова снаружи</li><li>Оптические коммутаторы перестраиваются на уровне заданий</li><li>BitNet: модель на 100 миллиардов параметров — демонстрация, реальные модели до около 10 миллиардов</li><li>Задержка RDMA на Thunderbolt 5: менее 50 мкс</li><li>Wi-Fi: раньше конвейерный параллелизм по Wi-Fi был отмечен как неподходящий, исправлено по prima.cpp</li><li>Примеры DeepSeek-V3 заменены на V4; замеры прошлых лет помечены годом</li></ul></div><div class="c"><h3>Не подтверждено, фактом не подано</h3><ul><li>«15–20 токенов в секунду при тензорном параллелизме по Ethernet»: замер даёт около 2 на четырёх Raspberry Pi</li><li>«12–18 токенов в секунду на двух Mac Studio»: зависит от модели</li><li>Накладные 10–20 % на проверку узлов</li><li>Выдача ответов копиями модели по Wi-Fi и потолок тензорного параллелизма по Wi-Fi: мой расчёт, не замер</li><li>Gossip SGD, Hogwild, model soups, TIES, sparse upcycling, федеративное и раздельное обучение, Forward-Forward (последняя карточка слайда 6): без цифр</li></ul></div></div><p class="sub" style="margin-top:12px">Ориентир для плотной модели: скорость не выше пропускной способности памяти, делённой на размер весов.</p>'}

S[0].x=[['Wi-Fi дома (3–7 мс, 320–610 Мбит/с)','выдача ответов копиями модели; конвейерный параллелизм на разнородных домашних устройствах (prima.cpp); тензорный параллелизм не годится'],['Домашний интернет (SWARM: менее 200 Мбит/с)','Petals, SWARM, DiLoCo (INTELLECT-1), асинхронное обучение с подкреплением'],['Ethernet 1–10 Гбит/с','конвейерный параллелизм, DiLoCo; тензорный параллелизм на 2–4 слабых узлах (distributed-llama)'],['Thunderbolt по протоколу TCP (~300 мкс)','конвейерный и контекстный параллелизм'],['Thunderbolt 5 с RDMA, прямым доступом к памяти (менее 50 мкс)','тензорный параллелизм на Mac (exo), контекстный параллелизм'],['InfiniBand / RoCE','экспертный параллелизм, FSDP, раздельные разбор запроса и выдача токенов'],['NVLink и стойка NVL72 (72 видеокарты)','тензорный и экспертный параллелизм внутри узла и стойки']].map((r,k)=>'<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:6px 0"><div style="width:'+(24+k*10)+'%;min-width:190px;box-sizing:border-box;background:color-mix(in srgb,var(--c1) '+(12+k*10)+'%,transparent);border:1px solid var(--c1);border-radius:6px;padding:7px 10px;font-weight:600;font-size:13px">'+r[0]+'</div><div style="font-size:13.5px">'+r[1]+'</div></div>').join('')+'<div class="g" style="margin-top:14px"><div class="c"><h3>Как читать схему</h3><p>Сверху вниз растёт качество связи, от Wi-Fi до NVLink. Справа от каждой сети названы методы, которые на ней практичны. Чем чаще метод обменивается данными, тем ниже ему нужно. Wi-Fi и домашний интернет подходят не всем: годятся PP, DP и редкая синхронизация, TP не годится.</p></div><div class="c"><h3>Два класса идей</h3><p>Разрезать одну модель (память суммируется, платим трафиком) или размножить нагрузку (память не суммируется, трафик почти нулевой). Дальше: приёмы серверов, смена самой модели, смена схемы обучения.</p></div><div class="c"><h3>О примерах</h3><p>Современные модели: DeepSeek-V4 (Pro 1,6 триллиона параметров, Flash 284 миллиарда), MiniMax-01, Llama 3 как эталон обучения. Замеры 2023–2025 помечены годом: метод не устаревает, цифры устаревают.</p></div><div class="c"><h3>Метки карточек</h3><p><span class="b bp">Практика</span> работает в реальных системах или есть замеры на железе. <span class="b bx">Прототип</span> реализация есть, но в демо-масштабе. <span class="b bt">Теория</span> идея с экспериментами в статье; на современных LLM в проверенных источниках не показана. <span class="b bn">Не проверено</span> названо без источника.</p></div></div>';

S.find(k=>k.t.startsWith('6.')).p.push(['prima.cpp: домашний кластер по Wi-Fi','prima.cpp (2025) запускает модели от 30 до 70 миллиардов параметров на разнородных домашних устройствах (ноутбуки, компьютеры, телефоны) через обычный Wi-Fi-роутер. В тестах канал 320–610 Мбит/с, задержка 3–7 мс. Устройства работают как конвейер по кольцу, веса подгружаются с диска, число слоёв на каждое устройство подбирается автоматически, а слабые устройства система отключает сама. По статье, быстрее llama.cpp, exo и dllama на моделях от 30 миллиардов параметров. По описанию проекта (README): QwQ-32B около 11 токенов в секунду, Llama 3-70B около 1,5. Главная цель — уместить модель, а не ускорить её.',V([['t',130,10,'токенов/с на домашних устройствах'],['r',60,27,73,73,'','g'],['t',96,23,'11'],['r',150,90,50,10,'','g'],['t',175,86,'1,5'],['t',96,114,'QwQ-32B'],['t',175,114,'Llama 3 70B']])]);
S.splice(1,0,{t:'Расшифровка сокращений',s:'Все сокращения из презентации. На карточках каждое сокращение также расшифровано при первом упоминании.',x:'<div class="g"><div class="c"><h3>PP, TP, CP, EP, SP, DP</h3><p style="font-size:13px;color:var(--fg)">конвейерный, тензорный, контекстный, экспертный параллелизм, параллелизм по последовательности и по данным (расшифровки на карточках)</p></div><div class="c"><h3>FSDP, ZeRO</h3><p style="font-size:13px;color:var(--fg)">полностью шардированный параллелизм по данным; оптимизатор без избыточности (Zero Redundancy Optimizer)</p></div><div class="c"><h3>MoE, MoA</h3><p style="font-size:13px;color:var(--fg)">смесь экспертов (Mixture of Experts); смесь агентов (Mixture of Agents)</p></div><div class="c"><h3>KV-кэш</h3><p style="font-size:13px;color:var(--fg)">кэш ключей и значений (Key-Value) внимания: хранит прошлые токены, чтобы не пересчитывать</p></div><div class="c"><h3>MLA, CSA, HCA, GQA, MQA</h3><p style="font-size:13px;color:var(--fg)">варианты внимания, сжимающие кэш; расшифровки на карточке «Сжатие кэша внимания»</p></div><div class="c"><h3>SSM</h3><p style="font-size:13px;color:var(--fg)">модели пространства состояний (State Space Models)</p></div><div class="c"><h3>RDMA, RoCE</h3><p style="font-size:13px;color:var(--fg)">удалённый прямой доступ к памяти (Remote Direct Memory Access); RDMA поверх Ethernet</p></div><div class="c"><h3>TCP, IP</h3><p style="font-size:13px;color:var(--fg)">протокол управления передачей (Transmission Control Protocol) и межсетевой протокол (Internet Protocol), основа обычных сетей</p></div><div class="c"><h3>RTT</h3><p style="font-size:13px;color:var(--fg)">время кругового обхода (Round-Trip Time): туда и обратно по сети</p></div><div class="c"><h3>GPU, CPU</h3><p style="font-size:13px;color:var(--fg)">графический (видеокарта) и центральный процессор</p></div><div class="c"><h3>VRAM, HBM, RAM, SSD, NVMe</h3><p style="font-size:13px;color:var(--fg)">видеопамять; высокоскоростная память видеокарт (High Bandwidth Memory); оперативная память; твердотельный диск; быстрый интерфейс дисков</p></div><div class="c"><h3>LLM, LM</h3><p style="font-size:13px;color:var(--fg)">большая языковая модель; языковая модель</p></div><div class="c"><h3>LoRA</h3><p style="font-size:13px;color:var(--fg)">низкоранговая адаптация (Low-Rank Adaptation): дообучение небольших добавок вместо всей модели</p></div><div class="c"><h3>RL, PPO</h3><p style="font-size:13px;color:var(--fg)">обучение с подкреплением (Reinforcement Learning); проксимальная оптимизация политики</p></div><div class="c"><h3>RAG</h3><p style="font-size:13px;color:var(--fg)">генерация с дополнением поиском (Retrieval-Augmented Generation)</p></div><div class="c"><h3>MTP</h3><p style="font-size:13px;color:var(--fg)">предсказание нескольких токенов сразу (Multi-Token Prediction)</p></div><div class="c"><h3>DNN, LSTM, SGD</h3><p style="font-size:13px;color:var(--fg)">глубокие нейронные сети; долгая краткосрочная память; стохастический градиентный спуск</p></div><div class="c"><h3>AFD, FFN</h3><p style="font-size:13px;color:var(--fg)">разделение внимания и FFN; полносвязная сеть слоя (feed-forward network)</p></div><div class="c"><h3>DiLoCo</h3><p style="font-size:13px;color:var(--fg)">Distributed Low-Communication: распределённое обучение с малым обменом</p></div><div class="c"><h3>Токен</h3><p style="font-size:13px;color:var(--fg)">часть слова, единица текста для модели</p></div><div class="c"><h3>7B, 70B, 405B</h3><p style="font-size:13px;color:var(--fg)">число параметров модели в миллиардах (B — billion)</p></div><div class="c"><h3>КБ, МБ, ГБ</h3><p style="font-size:13px;color:var(--fg)">килобайт, мегабайт, гигабайт; мс, мкс — миллисекунды, микросекунды; Мбит/с, Гбит/с — мегабиты и гигабиты в секунду</p></div></div>'});
